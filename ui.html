<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Audio</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4;
    --panel: #ffffff;
    --line: #e2e1dd;
    --text: #1d1c1a;
    --muted: #6f6d68;
    --accent: #c8623a;
    --ok: #2f7d4f;
    --err: #b3402f;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a;
      --panel: #201f24;
      --line: #33313a;
      --text: #eceaf0;
      --muted: #9a97a3;
      --accent: #e07d54;
      --ok: #63c48b;
      --err: #ef7d6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: 13px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  button {
    font: inherit;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.link {
    border: none; background: none; color: var(--muted);
    padding: 4px 6px; font-size: 13px; text-decoration: underline;
  }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  select, input[type=text] {
    font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input[type=text] { width: 100%; font-size: 13px; }
  .checks { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details[open] summary { margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .job {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--panel);
  }
  .job-top { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
  .job-title { font-weight: 600; word-break: break-word; font-size: 14px; }
  .job-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .job.done .bar > i { background: var(--ok); }
  .job.error .bar > i { background: var(--err); }
  .err {
    margin-top: 8px; font-size: 12.5px; color: var(--err);
    white-space: pre-wrap; word-break: break-word;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Reel Audio</h1></header>
  <p class="sub">Paste reel / short / video links. Get the audio back as files.</p>

  <div class="card">
    <textarea id="urls" placeholder="https://www.instagram.com/reel/...&#10;https://youtube.com/shorts/...&#10;https://www.tiktok.com/@user/video/..." spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="go">Extract audio</button>
      <label class="field" style="flex-direction:row;align-items:center;gap:8px">
        Format
        <select id="format"></select>
      </label>
      <button class="link" id="openFolder">Open save folder</button>
    </div>
  </div>

  <details class="card" id="opts">
    <summary>Options</summary>
    <label class="field">Save folder
      <input type="text" id="outDir" spellcheck="false">
    </label>
    <div class="row">
      <label class="field" style="flex-direction:row;align-items:center;gap:8px">
        Use my browser login
        <select id="browser">
          <option value="">off</option>
          <option value="chrome">Chrome</option>
          <option value="edge">Edge</option>
          <option value="firefox">Firefox</option>
          <option value="brave">Brave</option>
        </select>
      </label>
      <span class="job-meta" id="cookieNote"></span>
    </div>
    <div class="checks" style="margin-top:14px">
      <label><input type="checkbox" id="embedThumbnail"> Embed cover art &amp; tags</label>
      <label><input type="checkbox" id="allowPlaylist"> Allow whole playlists</label>
    </div>
    <div class="row">
      <button id="saveOpts">Save options</button>
      <button id="updateYtdlp">Update yt-dlp</button>
    </div>
  </details>

  <h2>Queue</h2>
  <div id="jobs"><div class="empty">Nothing yet.</div></div>
  <div class="row"><button class="link" id="clear">Clear finished</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let settings = {};
let busy = false;

function toast(msg, ms = 3200) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms);
}

async function api(path, options) {
  const res = await fetch(path, {
    headers: { 'content-type': 'application/json' },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function fmtSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / 1048576;
  return mb < 1 ? `${Math.round(bytes / 1024)} KB` : `${mb.toFixed(1)} MB`;
}

const STAGE_LABEL = {
  queued: 'waiting',
  starting: 'connecting',
  downloading: 'downloading',
  converting: 'converting audio',
  tagging: 'adding tags',
  done: 'ready',
  failed: 'failed',
};

function renderJobs(jobs) {
  const box = $('jobs');
  if (!jobs.length) {
    box.innerHTML = '<div class="empty">Nothing yet.</div>';
    return;
  }
  box.innerHTML = jobs.map((j) => {
    const meta = j.status === 'done'
      ? `${fmtSize(j.size)}`
      : `${STAGE_LABEL[j.stage] || j.stage}${j.status === 'running' && j.pct ? ' ' + Math.round(j.pct) + '%' : ''}`;
    const actions = j.status === 'done'
      ? `<div class="row" style="margin-top:10px">
           <a href="/api/file?id=${j.id}" download><button>Save file</button></a>
           <button class="link" data-reveal="${j.id}">Show in folder</button>
         </div>`
      : '';
    const error = j.error ? `<div class="err">${escapeHtml(j.error)}</div>` : '';
    return `<div class="job ${j.status}">
        <div class="job-top">
          <span class="job-title">${escapeHtml(j.title)}</span>
          <span class="job-meta">${escapeHtml(meta)}</span>
        </div>
        <div class="bar"><i style="width:${j.status === 'error' ? 100 : j.pct}%"></i></div>
        ${error}${actions}
      </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function applySettings(s, formats) {
  settings = s;
  if (formats && !$('format').options.length) {
    $('format').innerHTML = formats
      .map((f) => `<option value="${f}">${f === 'original' ? 'original (no re-encode)' : f}</option>`)
      .join('');
  }
  $('format').value = s.format;
  $('browser').value = s.browser;
  $('embedThumbnail').checked = s.embedThumbnail;
  $('allowPlaylist').checked = s.allowPlaylist;
  if (document.activeElement !== $('outDir')) $('outDir').value = s.outDir;
}

async function refresh() {
  try {
    const state = await api('/api/state');
    applySettings(state.settings, state.formats);
    $('cookieNote').textContent = state.hasCookiesFile ? 'using cookies.txt' : '';
    renderJobs(state.jobs);
  } catch { /* server restarting; next poll will pick it up */ }
}

$('go').addEventListener('click', async () => {
  if (busy) return;
  const urls = $('urls').value;
  if (!urls.trim()) return toast('Paste at least one link.');
  busy = true;
  $('go').disabled = true;
  try {
    const { added } = await api('/api/jobs', { method: 'POST', body: JSON.stringify({ urls }) });
    $('urls').value = '';
    toast(`Queued ${added.length} link${added.length === 1 ? '' : 's'}.`);
    refresh();
  } catch (err) {
    toast(err.message, 6000);
  } finally {
    busy = false;
    $('go').disabled = false;
  }
});

$('urls').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') $('go').click();
});

$('format').addEventListener('change', () => saveOptions(true));

function collectOptions() {
  return {
    outDir: $('outDir').value,
    format: $('format').value,
    browser: $('browser').value,
    embedThumbnail: $('embedThumbnail').checked,
    allowPlaylist: $('allowPlaylist').checked,
  };
}

async function saveOptions(quiet) {
  try {
    const { settings: s } = await api('/api/settings', {
      method: 'POST',
      body: JSON.stringify(collectOptions()),
    });
    applySettings(s);
    if (!quiet) toast('Options saved.');
  } catch (err) {
    toast(err.message, 6000);
  }
}

$('saveOpts').addEventListener('click', () => saveOptions(false));

$('updateYtdlp').addEventListener('click', async (e) => {
  e.target.disabled = true;
  toast('Updating yt-dlp...', 60000);
  try {
    const { message } = await api('/api/update-ytdlp', { method: 'POST' });
    toast(message.split('\n').pop() || 'Updated.', 6000);
  } catch (err) {
    toast(err.message, 6000);
  } finally {
    e.target.disabled = false;
  }
});

$('openFolder').addEventListener('click', () =>
  api('/api/reveal', { method: 'POST', body: JSON.stringify({}) }).catch(() => {}));

$('clear').addEventListener('click', async () => {
  await api('/api/clear', { method: 'POST', body: '{}' }).catch(() => {});
  refresh();
});

$('jobs').addEventListener('click', (e) => {
  const id = e.target.dataset?.reveal;
  if (id) api('/api/reveal', { method: 'POST', body: JSON.stringify({ id }) }).catch(() => {});
});

refresh();
setInterval(refresh, 800);
</script>
</body>
</html>
